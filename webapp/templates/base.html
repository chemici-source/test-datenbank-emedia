<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}E-Medien Statistik{% endblock %} · UB Bern Medizin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="dot"></span>
        <div>
          <h1>E-Medien Statistik</h1>
          <span>UB Medizin Bern</span>
        </div>
      </div>
      <a class="sidebar-home" href="{{ url_for('index') }}">&larr; Übersicht</a>
      <nav>
        {% for t in tables %}
        <a href="{{ url_for('table_view', table=t.name) }}" class="{{ 'active' if t.name == active_table else '' }}">
          <span>{{ t.label }}</span>
          <span class="badge">{{ t.rows }}</span>
        </a>
        {% endfor %}
      </nav>
    </aside>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
